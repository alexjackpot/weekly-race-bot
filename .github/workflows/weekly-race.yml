name: Weekly race card

on:
  schedule:
    # Saturday 05:17 Bangkok (Friday 22:17 UTC), then two backups at 07:17 and 09:17
    # Bangkok, all well before the 11:00 Slack reminder. GitHub starts scheduled runs
    # late and unpredictably (13 min on 10 Oct 2026, 4 h 30 on 24 Oct): a backup run
    # is a no-op once latest/ already holds this week's files.
    - cron: '17 22 * * 5'
    - cron: '17 0 * * 6'
    - cron: '17 2 * * 6'
  workflow_dispatch:
    inputs:
      week:
        description: 'Monday of the week, YYYY-MM-DD (blank = next Monday)'
        required: false
      variant:
        description: 'Colour 1-6 (blank = this week in the rotation)'
        required: false

permissions:
  contents: write

jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same Poppins files as Alex's Mac: the builder relies on it being installed.
      - name: Install Poppins
        run: mkdir -p ~/.local/share/fonts && cp fonts/*.otf ~/.local/share/fonts/ && fc-cache -f

      - name: Render on jackpotcomps.netlify.app
        id: render
        env:
          TZ_ID: Asia/Bangkok
          WEEK: ${{ inputs.week }}
          VARIANT: ${{ inputs.variant }}
          ROTATION: ${{ vars.ROTATION }}
        run: echo "json=$(node render.js)" >> "$GITHUB_OUTPUT"

      # latest/ is the link in Mathis's Slack reminder: it always holds this week's
      # PNG + zip under their real names, with a README showing the card. The
      # weekly commit also keeps the schedule alive (public repos stop running
      # scheduled jobs after 60 days without a commit).
      - name: Publish to latest/
        env:
          RESULT: ${{ steps.render.outputs.json }}
        run: |
          png=$(jq -r .png <<<"$RESULT"); zip=$(jq -r .zip <<<"$RESULT")
          title=$(basename "$png" .png)
          raw="https://github.com/$GITHUB_REPOSITORY/raw/main/latest"
          enc() { jq -rn --arg s "$(basename "$1")" '$s|@uri'; }
          colour=$(jq -r '"\(.variant) — \(.themeName)"' <<<"$RESULT")
          rm -rf latest && mkdir latest && cp "$png" "$zip" latest/
          # Direct download links: GitHub's own file view errors on these files.
          printf '# %s\n\n**[Download PNG](%s) · [Download zip](%s)**\n\n[![%s](%s)](%s)\n\nColour %s.\n' \
            "$title" "$raw/$(enc "$png")" "$raw/$(enc "$zip")" "$title" "$raw/$(enc "$png")" "$raw/$(enc "$png")" "$colour" > latest/README.md
          # Read by the Google Apps Script that copies the card into Drive (drive/Code.gs).
          jq '{week, name, variant, themeName, png: (.png | split("/") | last), zip: (.zip | split("/") | last)}' <<<"$RESULT" > latest/latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A latest
          git diff --cached --quiet || { git commit -m "$title" && git pull --rebase && git push; }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-race
          path: out/
          retention-days: 30
